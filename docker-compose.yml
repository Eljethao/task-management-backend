services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: task-management-api
    ports:
      - "${PORT:-8080}:8080"
    env_file:
      - .env
    environment:
      NODE_ENV: production
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
